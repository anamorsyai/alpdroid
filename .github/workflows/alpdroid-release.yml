name: Create AlpDroid release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.7.1)"
        required: true
        default: "v1.7.1"
      publish_release:
        description: "Publish a GitHub release (off = only upload the APK as a run artifact)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK, CMake and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Restore release keystore from secrets
        # The keystore never lives in git (see .gitignore + SECURITY.md): it arrives here as
        # base64 in KEYSTORE_BASE64, with passwords/alias in ALPDROID_* secrets. One-time
        # setup: base64 -w0 <your-release.jks>, then paste into the repo Actions secrets
        # (Settings → Secrets and variables → Actions) along with the three passwords/alias.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set (see workflow comments)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: .
        env:
          ALPDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALPDROID_STORE_PASSWORD: ${{ secrets.ALPDROID_STORE_PASSWORD }}
          ALPDROID_KEY_ALIAS: ${{ secrets.ALPDROID_KEY_ALIAS }}
          ALPDROID_KEY_PASSWORD: ${{ secrets.ALPDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        env:
          TAG: ${{ inputs.tag_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "AlpDroid-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlpDroid-${{ inputs.tag_name }}
          path: AlpDroid-${{ inputs.tag_name }}.apk
          if-no-files-found: error

      - name: Create release with the APK attached
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          APK="AlpDroid-${TAG}.apk"
          VER="${TAG#v}"
          # Release notes = this version's section of CHANGELOG.md ("## X.Y.Z — title").
          awk -v ver="$VER" 'index($0, "## " ver " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > changes.md
          [ -s changes.md ] || echo "See CHANGELOG.md for what changed." > changes.md
          {
            echo "## What's new"
            echo
            cat changes.md
            echo
            echo "## Install"
            echo
            echo "Download **${APK}** below and open it. It installs over an existing AlpDroid because every release is signed with the same key. First launch downloads Alpine once (internet needed)."
            echo
            echo "Android 7.0+ · arm64, armv7, x86_64, x86. Full docs: [User guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/USER_GUIDE.md) · [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "AlpDroid $TAG" --notes-file notes.md

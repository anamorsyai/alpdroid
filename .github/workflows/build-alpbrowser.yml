name: Build AlpBrowser APK

# AlpBrowser is a lean standalone intercepting browser (WebView + the core-proxy MITM engine), controlled by the
# AlpDroid agent. It needs none of the :app proot/Alpine/opencode pipeline, so it has its own workflow.
#
# push / plain dispatch -> tests + an unsigned debug APK uploaded as a run artifact.
# dispatch with publish_release -> a SIGNED release APK (same ALPDROID_* keystore as :app) and a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. alpbrowser-v0.1.0)"
        required: false
        default: "alpbrowser-v0.1.0"
      publish_release:
        description: "Build a signed release APK and publish a GitHub release (off = debug APK artifact only)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main, "feature/**", "fix/**", "ccr-**"]
    paths:
      - "alpbrowser/**"
      - "core-proxy/**"
      - ".github/workflows/build-alpbrowser.yml"

permissions:
  contents: write

jobs:
  # Fast check on every push: unit tests + a debug APK. Skipped on a publish dispatch (the release job covers it).
  debug:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      - name: Unit tests (core-proxy + alpbrowser)
        run: ./gradlew :core-proxy:test :alpbrowser:testDebugUnitTest --stacktrace
      - name: Build AlpBrowser debug APK
        run: ./gradlew :alpbrowser:assembleDebug --stacktrace
      - name: Upload AlpBrowser APK
        uses: actions/upload-artifact@v4
        with:
          name: alpbrowser-debug-apk
          path: alpbrowser/build/outputs/apk/debug/alpbrowser-debug.apk
          if-no-files-found: error

  # Signed release + GitHub release, only on an explicit publish dispatch.
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests (core-proxy + alpbrowser)
        run: |
          chmod +x gradlew
          ./gradlew :core-proxy:test :alpbrowser:testDebugUnitTest --stacktrace

      - name: Restore release keystore from secrets
        # Same signing identity as :app, so AlpBrowser installs/updates over an earlier copy. The keystore never lives
        # in git: it arrives as base64 in KEYSTORE_BASE64, with passwords/alias in the ALPDROID_* secrets.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ALPDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ALPDROID_STORE_PASSWORD: ${{ secrets.ALPDROID_STORE_PASSWORD }}
          ALPDROID_KEY_ALIAS: ${{ secrets.ALPDROID_KEY_ALIAS }}
          ALPDROID_KEY_PASSWORD: ${{ secrets.ALPDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :alpbrowser:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        env:
          TAG: ${{ inputs.tag_name }}
        run: cp alpbrowser/build/outputs/apk/release/alpbrowser-release.apk "AlpBrowser-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlpBrowser-${{ inputs.tag_name }}
          path: AlpBrowser-${{ inputs.tag_name }}.apk
          if-no-files-found: error

      - name: Build update deltas
        # Small patches from the last few releases to this one, so installed apps download only what changed. Optional:
        # the full APK is always published, and a failure here never blocks the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: bash scripts/release_deltas.sh browser "$TAG" "AlpBrowser-${TAG}.apk" 3

      - name: Create release with the APK attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          APK="AlpBrowser-${TAG}.apk"
          {
            echo "## AlpBrowser"
            echo
            echo "A standalone, agent-controlled intercepting browser for AlpDroid — bug-bounty (scope, live intercept, match-and-replace rules, repeater, TLS-decrypted history) and web-dev (console capture, JS/DOM eval, network history, CDP DevTools). The AlpDroid agent drives it over a loopback control API (\`browserctl\`); AlpDroid ships the built-in instructions agents read automatically."
            echo
            echo "## Install"
            echo
            echo "Download **${APK}** below and open it. It is a separate app from AlpDroid (\`com.alpdroid.browser\`), signed with the same key so it installs/updates cleanly."
            echo
            echo "Android 8.0+ (minSdk 26). Control API on 127.0.0.1 with a per-install token shown in the app."
          } > notes.md
          shopt -s nullglob
          gh release create "$TAG" "$APK" deltas/*.adp --target "$GITHUB_SHA" --title "AlpBrowser $TAG" --notes-file notes.md

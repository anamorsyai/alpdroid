<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3ED0B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#0D1117"/>
  <text x="40" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="32" font-weight="bold" fill="#FFFFFF">AlpDroid — Terminal-only Architecture</text>
  <text x="40" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">No proxy. Android UI talks to Alpine guest over proot + PTY bridge.</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="40" y="130" width="310" height="200" rx="12" fill="#161B22" stroke="#3ED0B8" stroke-width="2"/>
    <text x="60" y="162" font-size="20" font-weight="bold" fill="#3ED0B8">Android App UI</text>
    <text x="60" y="192" font-size="16" fill="#8B949E">Tabs • File Browser</text>
    <text x="60" y="216" font-size="16" fill="#8B949E">Compose + WebView</text>
    <text x="60" y="260" font-size="16" fill="#FFFFFF">- Tab manager</text>
    <text x="60" y="286" font-size="16" fill="#FFFFFF">- File browser</text>
    <text x="60" y="312" font-size="16" fill="#FFFFFF">- Plugin screens</text>

    <rect x="40" y="370" width="310" height="170" rx="12" fill="#161B22" stroke="#3ED0B8" stroke-width="2"/>
    <text x="60" y="402" font-size="20" font-weight="bold" fill="#3ED0B8">Terminal Emulator</text>
    <text x="60" y="432" font-size="16" fill="#8B949E">Compose canvas</text>
    <text x="60" y="474" font-size="16" fill="#FFFFFF">- vt100 / xterm.js</text>
    <text x="60" y="500" font-size="16" fill="#FFFFFF">- touch keyboard</text>

    <rect x="440" y="250" width="280" height="180" rx="12" fill="#161B22" stroke="#3ED0B8" stroke-width="3"/>
    <text x="460" y="282" font-size="20" font-weight="bold" fill="#3ED0B8">PTY Bridge (C)</text>
    <text x="460" y="312" font-size="16" fill="#8B949E">JNI • forkpty</text>
    <text x="460" y="354" font-size="16" fill="#FFFFFF">- pty master/slave</text>
    <text x="460" y="380" font-size="16" fill="#FFFFFF">- stdin/stdout pipe</text>
    <text x="460" y="406" font-size="16" fill="#FFFFFF">- resize / signals</text>

    <rect x="810" y="250" width="350" height="180" rx="12" fill="#161B22" stroke="#3ED0B8" stroke-width="2"/>
    <text x="830" y="282" font-size="20" font-weight="bold" fill="#3ED0B8">proot + Alpine rootfs</text>
    <text x="830" y="312" font-size="16" fill="#8B949E">guest, no root</text>
    <text x="830" y="354" font-size="16" fill="#FFFFFF">- apk packages</text>
    <text x="830" y="380" font-size="16" fill="#FFFFFF">- shell / tmux / ssh</text>
    <text x="830" y="406" font-size="16" fill="#FFFFFF">- /sdcard bind mount</text>

    <rect x="440" y="560" width="280" height="160" rx="12" fill="#161B22" stroke="#3ED0B8" stroke-width="2"/>
    <text x="460" y="592" font-size="20" font-weight="bold" fill="#3ED0B8">Agent API (alpctl)</text>
    <text x="460" y="622" font-size="16" fill="#8B949E">control plane</text>
    <text x="460" y="664" font-size="16" fill="#FFFFFF">- tabs, notify, clip</text>
    <text x="460" y="690" font-size="16" fill="#FFFFFF">- plugins, settings</text>

    <rect x="810" y="560" width="350" height="160" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <text x="830" y="592" font-size="20" font-weight="bold" fill="#FFFFFF">Plugins</text>
    <text x="830" y="622" font-size="16" fill="#8B949E">user scripts + fields</text>
    <text x="830" y="664" font-size="16" fill="#FFFFFF">- FIELD_* env vars</text>
    <text x="830" y="690" font-size="16" fill="#FFFFFF">- via alpctl only</text>

    <rect x="810" y="130" width="350" height="90" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <text x="830" y="162" font-size="20" font-weight="bold" fill="#FFFFFF">GitHub OAuth</text>
    <text x="830" y="192" font-size="16" fill="#8B949E">plain git auth, device flow</text>
  </g>

  <g stroke="#3ED0B8" stroke-width="2" fill="none">
    <line x1="350" y1="230" x2="435" y2="300" marker-end="url(#arrow)"/>
    <line x1="350" y1="455" x2="435" y2="360" marker-end="url(#arrow)"/>
    <line x1="720" y1="340" x2="805" y2="340" marker-end="url(#arrow)"/>
    <line x1="805" y1="360" x2="725" y2="360" marker-end="url(#arrow)"/>
    <line x1="580" y1="430" x2="580" y2="555" marker-end="url(#arrow)"/>
    <line x1="720" y1="640" x2="805" y2="640" marker-end="url(#arrow)"/>
    <line x1="880" y1="220" x2="620" y2="245" marker-end="url(#arrow)"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#3ED0B8">
    <text x="372" y="262">ui</text>
    <text x="372" y="432">pty io</text>
    <text x="735" y="322">shell io</text>
    <text x="585" y="505">alpctl</text>
    <text x="730" y="622">plugin calls</text>
    <text x="700" y="212">git auth</text>
  </g>
</svg>
